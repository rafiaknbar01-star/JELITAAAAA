<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>I'm Sorry</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .container {
      color: white;
    }

    h1 {
      font-size: 50px;
      animation: fadeIn 2s ease;
    }

    p {
      font-size: 20px;
      margin: 20px 0;
      animation: fadeIn 3s ease;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      margin: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background-color: #4CAF50;
      color: white;
    }

    #no {
      background-color: #f44336;
      color: white;
      position: absolute;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>

<div class="container">
  <h1>I'm sorry</h1>
  <p>Maukah Jelita Rachmawati memaafkan Muhammad Rafi Akbar?</p>
  <button id="yes" onclick="goYes()">Iya</button>
  <button id="no">Gamau</button>
</div>

<script>
  const noBtn = document.getElementById("no");

  noBtn.addEventListener("click", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  function goYes() {
    window.location.href = "ya.html";
  }
</script>

</body>
</html>
